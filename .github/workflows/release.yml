name: Release

on:
  push:
    tags: ["v*"]
  # Rehearsal: runs the same verification and collects the jars, but creates no Release.
  workflow_dispatch:

jobs:
  # The full CI (build + client game test for every version). A failure here stops the release.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The jars CI built and then launched in the game test, not a fresh rebuild.
      - name: Collect the tested jars
        uses: actions/download-artifact@v7
        with:
          pattern: cele-tweaks-mc*
          path: dist
          merge-multiple: true

      - name: Keep runtime jars only
        run: |
          find dist -name '*-sources.jar' -delete
          ls -la dist
          count=$(find dist -name 'cele-tweaks-*.jar' | wc -l)
          [ "$count" -eq 3 ] || { echo "expected 3 jars (one per Minecraft version), found $count"; exit 1; }

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: "Cele-Tweaks ${{ github.ref_name }}"
          files: dist/*.jar
          generate_release_notes: true
