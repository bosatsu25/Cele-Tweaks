// Shared build logic, applied by versions/<mc>/build.gradle.
// Sources: src/main (all versions) + src/<overlay> for each entry of `source_overlays`.

def mcVersion = project.name

version = "${rootProject.property('mod_version')}+mc${mcVersion}"
group = rootProject.property('maven_group')
base { archivesName = rootProject.property('archives_base_name') }

repositories {
    maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/releases/' }
    mavenCentral()
}

dependencies {
    // 26.x ships un-obfuscated: non-remapping Loom, no mappings line.
    minecraft "com.mojang:minecraft:${project.property('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${project.property('loader_version')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.property('fabric_api_version')}"
    if (project.hasProperty('modmenu_version')) {
        compileOnly "com.terraformersmc:modmenu:${project.property('modmenu_version')}"
    }
}

def overlays = (project.findProperty('source_overlays') ?: '').toString()
        .split(',').collect { it.trim() }.findAll { !it.isEmpty() }

sourceSets {
    main {
        java.srcDirs = [rootProject.file('src/main/java')] + overlays.collect { rootProject.file("src/${it}/java") }
        resources.srcDirs = [rootProject.file('src/main/resources')] + overlays.collect { rootProject.file("src/${it}/resources") }
    }
}

// Client game test (`runClientGameTest`): launches the real client with the mod, never shipped.
// Sources live in the shared src/gametest, like src/main.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'celetweaks-gametest'
        enableGameTests = false
        enableClientGameTests = true
    }
}

sourceSets {
    gametest {
        java.srcDirs = [rootProject.file('src/gametest/java')]
        resources.srcDirs = [rootProject.file('src/gametest/resources')]
    }
}

// CI's integration job passes -Pintegration_mods=<dir> holding the optional mods' jars, so the game
// test runs with them installed. They are never a compile dependency.
def integrationMods = findProperty('integration_mods')
if (integrationMods) {
    dependencies {
        gametestRuntimeOnly fileTree(dir: integrationMods.toString(), include: '*.jar')
    }
}

// Groups main's classes and resources into one mod for dev runs; the game test mod gets its own group.
loom {
    mods {
        register(rootProject.property('mod_id').toString()) {
            sourceSet sourceSets.main
        }
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

def metadata = [
        version           : project.version.toString(),
        minecraft_version : mcVersion,
        loader_version    : project.property('loader_version').toString(),
        fabric_api_version: project.property('fabric_api_version').toString(),
]

processResources {
    inputs.properties(metadata)
    filesMatching('fabric.mod.json') { expand(metadata) }
}

jar {
    from(rootProject.file('LICENSE')) { rename { "${it}_${base.archivesName.get()}" } }
    from(rootProject.file('NOTICE'))
}
